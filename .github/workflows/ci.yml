name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Code must match .prettierrc.json (run `npm run format` to fix).
      - run: npm run format:check
      # Fails on dropped records, duplicate ids, broken aliases or unreadable raw files.
      - run: npm run data:strict
      # Type-check + production build (prebuild regenerates the data bundle).
      - run: npm run build
      - run: npm test
      # Per-category price / weight / metric coverage: printed to the job summary, and
      # fails when the README table is stale (run `npm run coverage` and commit it).
      - run: npm run coverage -- --check

  # The backend (worker/): its own dependencies, type-check and tests in the Workers runtime.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
