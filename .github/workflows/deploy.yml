name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # `npm run build` runs scripts/build-data.mjs first (prebuild), then tsc, vite, and
      # scripts/prerender.mjs (static HTML for every category and item, sitemap.xml, 404.html).
      # Path URLs need an absolute base: a project site lives under /<repo>/ (with a custom
      # domain at the root, set VITE_BASE to /). SITE_URL makes canonical links absolute and
      # turns on the sitemap: the Pages URL, e.g. https://<user>.github.io/<repo>.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
